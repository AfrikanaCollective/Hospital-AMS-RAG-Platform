# Hospital RAG Platform — local self-hosted deployment (ARCH-036 / PRD-106).
# Profiles:  core  = api, worker, redis, postgres, qdrant, proxy, frontend
#            dev   = core + llm-gateway stub + seed helpers
#            full  = dev + keycloak + review-webhook echo
# Only the proxy publishes a port. Core flows need no external network.

x-backend-env: &backend-env
  env_file: .env

services:
  proxy:
    image: nginx:1.27-alpine
    profiles: ["core", "dev", "full"]
    depends_on: [api, frontend]
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    healthcheck:
      # 127.0.0.1, not "localhost": nginx's `listen 80`/`listen 443 ssl`
      # bind IPv4 only, but the container's /etc/hosts resolves "localhost"
      # to both 127.0.0.1 and ::1 — busybox wget (this image's wget) tries
      # ::1 first and does not fall back to the IPv4 address on refusal, so
      # every check failed with "Connection refused" despite nginx serving
      # real requests correctly (DEVIATIONS.md #102). `api`'s own healthcheck
      # (Python's urllib) doesn't hit this — its resolver order falls back.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    profiles: ["core", "dev", "full"]
    expose: ["80"]

  api:
    build:
      context: ./backend
    <<: *backend-env
    profiles: ["core", "dev", "full"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    expose: ["8000"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
    user: "10001:10001"
    # Lets a container reach an LLM/embedding gateway published on the HOST's
    # own localhost (e.g. an operator-run gateway on 127.0.0.1:8443) via
    # LLM_GATEWAY_URL=https://host.docker.internal:<port> — needs the
    # `host-gateway` special value on Linux (Docker Desktop provides this
    # name automatically; Linux Engine does not, hence this entry). Harmless
    # no-op for the default in-network stub gateway (DEVIATIONS.md #103).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Inert until EMBEDDING_BACKEND/RERANKER_BACKEND=local is implemented
      # (Phase 2) and the image is built with the `local-models` extra
      # (DEVIATIONS.md #43). Persists downloaded HF model weights across
      # restarts instead of re-fetching them from the internet each time.
      - hf-model-cache:/home/appuser/.cache/huggingface
      # Shared with `worker` (DEVIATIONS.md #95): `POST /ingest/documents`
      # writes an uploaded file here, then hands off to `worker` (a
      # *different container*) via `process_document.delay(...)` to parse
      # it — without a shared mount the file only exists on `api`'s own
      # ephemeral container filesystem and `worker` gets FileNotFoundError.
      # A host bind mount also matches this directory's other documented use
      # (ARCH-038: "the same directory an operator manually drops PDFs
      # into") and makes uploads survive a container recreate.
      - ./data/excerpt_guidelines:/app/data/excerpt_guidelines
      # Figure/table crops written at ingestion for the reviewer UI
      # (ARCH-044, INGEST_CROP_DIR); shared so `worker` writes what `api` serves.
      - ./data/ingest_artifacts:/app/data/ingest_artifacts
      # Read-only: archival full-publication originals a source_pages excerpt
      # was pulled from (DEVIATIONS.md #167/#173). Never scanned by
      # scripts/prepare_sample_guidelines.py (which only walks
      # SAMPLE_GUIDELINES_DIR) and never a target for new ingestion -- this
      # mount exists only so an already-ingested Document.source_uri that
      # legitimately points here (a full document later superseded by an
      # excerpt) remains resolvable if that document_version is ever
      # reprocessed, not to make this directory part of the discoverable
      # corpus.
      - ./data/guideline_sources:/app/data/guideline_sources:ro
      - ./data/patient_records:/app/data/patient_records
      # Operator-editable clinical-concept vocabulary (SCOPE-2.6/ARCH-042,
      # PRD-057) -- same rationale as the two mounts above: this is an
      # operator-attested artifact (DEVIATIONS.md #143/#146/#149) that must
      # be editable on the host without a rebuild, read by
      # `scripts/run_orchestration_ablation.py` inside this container. Also
      # mounted into `worker` (DEVIATIONS.md #186) -- see the matching
      # comment there for why that mount was missing until now.
      - ./data/clinical_concepts.yaml:/app/data/clinical_concepts.yaml:ro
      # Operator-attested four-area question openings (DEVIATIONS.md #258);
      # read by the four-area question generator.
      - ./data/query_areas.yaml:/app/data/query_areas.yaml:ro
      # Read-only: an optional extra CA cert for LLM_GATEWAY_CA_BUNDLE /
      # EMBEDDING_GATEWAY_CA_BUNDLE, e.g. a self-signed cert on an operator's
      # own gateway (DEVIATIONS.md #103). Gitignored (deploy/tls/*.pem); the
      # directory is mounted even when empty so no build/rebuild is needed
      # just to add a cert later.
      - ./deploy/tls:/app/deploy/tls:ro
    # Optional GPU passthrough for local embedding/reranker inference (needs
    # the NVIDIA Container Toolkit on the host). CPU fallback works without
    # this — see README.md "Requirements". Uncomment when RERANKER_DEVICE or
    # EMBEDDING_BACKEND local-serving is actually enabled in Phase 2:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  worker:
    build:
      context: ./backend
    <<: *backend-env
    profiles: ["core", "dev", "full"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      qdrant: {condition: service_started}
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-l", "info"]
    user: "10001:10001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - hf-model-cache:/home/appuser/.cache/huggingface
      # Shared with `api` — see the matching comment there (DEVIATIONS.md #95).
      - ./data/excerpt_guidelines:/app/data/excerpt_guidelines
      # Figure/table crops written at ingestion for the reviewer UI
      # (ARCH-044, INGEST_CROP_DIR); shared so `worker` writes what `api` serves.
      - ./data/ingest_artifacts:/app/data/ingest_artifacts
      - ./data/guideline_sources:/app/data/guideline_sources:ro
      - ./data/patient_records:/app/data/patient_records
      # Operator-editable clinical-concept vocabulary (SCOPE-2.6/ARCH-042,
      # PRD-057) — was `api`-only until DEVIATIONS.md #186 found the gap:
      # `app.eval.auto_seed`'s multi-stage audit fields need to read
      # `data/clinical_concepts.yaml` from the real Celery task
      # (`eval.auto_seed_review_queue`), which runs in THIS container, not
      # `api` — the mount just never existed here because nothing running in
      # `worker` had ever needed it before.
      - ./data/clinical_concepts.yaml:/app/data/clinical_concepts.yaml:ro
      # Operator-attested four-area question openings (DEVIATIONS.md #258);
      # read by the four-area question generator.
      - ./data/query_areas.yaml:/app/data/query_areas.yaml:ro
      - ./deploy/tls:/app/deploy/tls:ro

  redis:
    image: redis:7-alpine
    profiles: ["core", "dev", "full"]
    command: ["redis-server", "--requirepass", "redis_pw"]
    expose: ["6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pw", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    profiles: ["core", "dev", "full"]
    environment:
      POSTGRES_DB: hospital_rag
      POSTGRES_USER: hrag_admin
      POSTGRES_PASSWORD: hrag_admin_pw
    expose: ["5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrag_admin -d hospital_rag"]
      interval: 10s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["core", "dev", "full"]
    environment:
      QDRANT__SERVICE__API_KEY: change-me-in-real-deploy
    expose: ["6333"]
    volumes: ["qdrant-data:/qdrant/storage"]

  llm-gateway:
    build:
      context: ./backend
    <<: *backend-env
    profiles: ["dev", "full"]
    command: ["python", "-m", "app.llm.stub_server"]
    expose: ["8080"]
    # Offline deterministic fake of the self-hosted gateway (canned completions,
    # echo embeddings) so dev/CI need no network. Real deploys point
    # LLM_GATEWAY_URL at the actual self-hosted gateway and drop this service.

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["full"]
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    expose: ["8080"]

  review-webhook:
    image: mendhak/http-https-echo:latest
    profiles: ["full"]
    expose: ["8080"]

volumes:
  pg-data:
  redis-data:
  qdrant-data:
  hf-model-cache:
