[project]
name = "hospital-rag-platform"
version = "0.1.0"
description = "RAG platform for hospital use — grounded, cited answers with multi-agent orchestration and HITL evaluation."
requires-python = ">=3.11"

# Exact versions are pinned in requirements-lock.txt (PRD-NFR-3 / DEVIATIONS.md
# #45) — regenerate it with `make lock` after changing anything below. The
# ranges here are the resolver's *input* constraints, not the installed
# versions; `pip install -e .` alone (no lock) still floats within them.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    # anyio>=4.15 deprecates anyio.abc.BlockingPortal (used internally by
    # starlette.testclient at import time); pyproject's own
    # filterwarnings=["error::DeprecationWarning"] turns that into a hard
    # pytest collection failure for every fastapi.testclient.TestClient user
    # (tests/test_smoke.py). Not a starlette/fastapi incompatibility — pinned
    # here, not there, so we keep the latest fastapi/starlette otherwise.
    # DEVIATIONS.md #45.
    "anyio<4.15",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "pypdf>=5.1",
    "pillow>=11.0",  # pypdf's own image-extraction path needs this for real
    # figures (ARCH §6 rule 3b, app.ingestion.chunking._extract_pdf_figures) --
    # without it pypdf raises ImportError on any PDF with embedded images,
    # not just skips figure extraction (DEVIATIONS.md #174).
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "pyjwt>=2.9",  # dev-JWT auth provider (ARCH-011)
    "structlog>=24.4",
    "cryptography>=43.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
    "faker>=30.0",           # synthetic data generator only
    "krippendorff>=0.8",     # IRR metric (ARCH-021)
    "pip-tools>=7.4",        # `make lock` (PRD-NFR-3 / DEVIATIONS.md #45)
]
# Optional local model backends (ARCH-004 / ARCH-012). Not needed with
# EMBEDDING_BACKEND=stub / RERANKER_BACKEND=stub.
local-models = [
    "sentence-transformers>=3.3",
    "torch>=2.5",
]
# Phase 6 retrieval-tuning report generation only (PRD-109 / ARCH-040,
# app/eval/retrieval_tuning/report.py, scripts/run_retrieval_weight_sweep.py).
# Not needed to run the app or the rest of the test suite.
retrieval-tuning = [
    "seaborn>=0.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
]
# Layout-aware guideline PDF ingestion (ARCH-044 / PRD-113,
# app/ingestion/layout/). The exact installed closure is pinned in
# requirements-layout.txt, which the Dockerfile installs; only
# app.ingestion.layout.docling_adapter imports these.
layout-parse = [
    "docling>=2.130",
    "pdfplumber>=0.11.10",
    "rapidocr>=3.9",
    "onnxruntime>=1.30",
    "opencv-python-headless>=4.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Autogenerated (`alembic revision --autogenerate`); hand-wrapping generated
# migration code would drift from what the next autogenerate run produces.
extend-exclude = ["alembic/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's DI pattern is `param: T = Depends(...)` — a call in an argument
# default is the documented, idiomatic way to declare a dependency; B008
# exists to catch a *different* mistake (a mutable/expensive default shared
# across calls) that doesn't apply here, since FastAPI itself calls Depends()
# fresh per request. See https://fastapi.tiangolo.com/tutorial/dependencies/.
"app/api/**" = ["B008"]
# Test-file idioms ruff's default rule set penalizes but that are correct
# here, not smells: PLR2004 flags literal HTTP status codes / expected counts
# in assertions (`assert resp.status_code == 200`) — naming a constant per
# assertion would reduce readability, not improve it. PLC0415 flags imports
# inside a test function body, the established pattern throughout this suite
# for constructing a fake/offline double next to the one test that needs it
# (keeps top-of-file imports minimal and avoids pulling in a module — or its
# real dependencies, e.g. a real DB driver — for tests that don't touch it).
"tests/*" = ["PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# The layout-parse extra (ARCH-044) is only installed in the image; the one
# module that imports it (app.ingestion.layout.docling_adapter) is typed
# against our own dataclasses, not the parsers' types.
[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "pdfplumber", "pdfplumber.*", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
