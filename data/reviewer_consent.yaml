#   identifiers" and that data are "anonymised" / "recorded anonymously".
#   This platform stores the sign-in email, a Safaricom number, organisation
#   and role title, and links every rating to the account (needed to count
#   completed scenarios and pay data bundles). That is identifiable data, so
#   the draft describes what is stored and says analysis datasets are
#   de-identified (pseudonymised with a study code) instead.
# - The template listed age as collected; the form does not ask for age. It
#   omitted sex, role/title, telephone number and email, which are collected.
# - "The web form ... successfully deters any security vulnerabilities" was
#   replaced with the actual protections (HTTPS, sign-in, admin-only access,
#   encrypted telephone number); no system can promise to deter every
#   vulnerability.
# - "Survey", "Delphi round" and "45-60 minutes" describe a one-off survey;
#   review here is per scenario with a completion count, so those parts are
#   marked [CONFIRM].
# - Wording tidied ("carder" -> cadre, "is will" -> will, "AI tools" -> "an
#   AI tool"); the training-tools sentence in Benefits was dropped as it
#   describes a different study arm. [CONFIRM: restore if it applies.]
