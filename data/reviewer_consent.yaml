# Informed consent shown to a clinician reviewer before first registration
# (DEVIATIONS.md #282). A reviewer who declines cannot register and is sent
# back to the sign-in page.
#
# DRAFT, written 2026-10-07 from the study's consent template supplied by the
# operator, then corrected to match what this platform actually collects and
# stores (see "Changes from the template" at the bottom). Items marked
# [CONFIRM: ...] need the operator's decision before use.
#
# Like data/query_areas.yaml, the app uses this file only while every
# attestation field below is filled in by the operator. Until then the
# consent step, and so registration, is refused (fail closed). Any later edit
# changes the text's sha256; each reviewer's consent records the version and
# hash they agreed to.

authored_by: "Timothy Tuti"
authored_role: "Primary Investigator"
authored_date: "07 October 2026"
ethics_approved_version: "v4.1, SERU approval date 30th September 2026"   # e.g. "v1.0, SERU approval dated ..."

version: "v4.1"

title: >-
  Building Reliable Information from Data Generated in Everyday clinical
  practice in Kenya: the Data BRIDGE project

sections:

  - heading: Lay title
    body: >-
      A study to improve the collection, reporting and use of clinical data
      from routine hospital care in day-to-day decision-making by healthcare
      providers and policy makers in Kenya.

  - heading: Researchers
    body: >-
      KEMRI-Wellcome Trust Research Programme (Dr Timothy Tuti, Dr Paul
      Mwaniki, Dr Jacob Kazungu, Dr Audrey Mumbi, Dr Epeni Abigael, Mr George
      Mbevi, Mr Alphonse Kemei, Miss Maryann Kangau, Miss Ivy Kutswa);
      University of Oxford, Nuffield Department of Medicine (Prof. Mike
      English).

  - heading: Funder
    body: The Wellcome Trust (London, UK).

  - heading: Aim
    body: >-
      To evaluate the performance, safety and clinical usefulness of
      AI-generated responses to neonatal clinical scenarios, using
      assessments by healthcare professionals to benchmark their potential
      for supporting routine clinical decision-making.

  - heading: What taking part involves
    body: >-
      You will review clinical scenarios about newborns and assess responses
      generated by an AI tool to questions about their assessment and
      management. You will rate each response against set criteria,
      including clinical accuracy, completeness, consistency with clinical
      guidelines, safety and usefulness for clinical decision-making. The
      scenarios are built from de-identified or simulated records and do not
      involve the care of any real patient. Each scenario takes about 60 to 90 seconds;
      we ask you to review at least 40 scenarios.
      Your assessments will be used to evaluate the performance and potential
      risks of AI-enabled decision-support tools.

  - heading: What information we collect
    body: >-
      To create your reviewer account we record the email address you sign in
      with (a Google account, or an email address and password). When you
      register we also ask for your sex, clinical cadre, expertise level,
      years of experience after internship, current work organisation,
      current role or title and, optionally, a Kenyan Safaricom or Airtel
      telephone number for data-bundle reimbursement (participants in Kenya
      only). Every rating
      you submit is stored linked to your reviewer account. We do not ask for
      your name, age or date of birth.

  - heading: Why we collect it
    body: >-
      Your cadre, expertise level, years of experience, organisation and role
      let us describe who took part and compare assessments across groups of
      reviewers. Your telephone number, if you give one, is used only to send
      data-bundle reimbursements. Linking ratings to your account lets us count the
      scenarios you have completed, for reimbursement, and avoid showing you
      the same scenario twice.

  - heading: How your information is protected
    body: >-
      The platform is reached over an encrypted (HTTPS) connection and needs
      you to sign in. Only the study's administrators can see your
      registration details; your telephone number is stored encrypted. Other
      reviewers cannot see your details or your ratings. Datasets used for
      analysis and publication will not contain your email address, telephone
      number, organisation or role title: each reviewer is identified only by
      a study code. KEMRI-Wellcome Trust Research Programme is the data
      controller for your personal data and will process it for the purpose
      of the research described here. Research is a task performed in the
      public interest. Your telephone number will be kept until your
      data-bundle reimbursements are complete and then deleted. Your email
      address will be kept until analysis is complete and then deleted.


  - heading: Benefits and reimbursement
    body: >-
      There are no direct benefits to you from taking part, although we
      expect the findings to inform the design of AI tools suited to
      hospitals in sub-Saharan Africa. To cover your mobile data costs,
      participants based in Kenya will receive a data bundle worth KES 500
      for every 40 scenarios they complete, sent to the Kenyan Safaricom or
      Airtel number they provide. Participants outside Kenya are welcome to
      take part but cannot be reimbursed.

  - heading: Ethical review
    body: >-
      KEMRI Scientific and Ethics Review Unit (SERU, Protocol number: 4901).

  - heading: Voluntary participation and withdrawal
    body: >-
      Taking part is voluntary. You can choose not to take part, and if you
      agree you can change your mind and withdraw at any time, without giving
      a reason and without any consequences, by emailing the KEMRI-Wellcome contact below.
      We will delete your ratings on request to withdraw from the study.

  - heading: Contacts
    body: >-
      For any question about this research, contact Dr Timothy Tuti,
      KEMRI-Wellcome Trust Research Programme (TTuti@kemri-wellcome.org). To
      ask someone independent about this research, contact: the Community
      Liaison Manager, KEMRI-Wellcome Trust Research Programme, P.O. Box 230,
      Kilifi (telephone 0723 342 780 or 0705 154 386); or the Head, KEMRI
      Scientific and Ethics Review Unit, P.O. Box 54840-00200, Nairobi
      (telephone 0717 719 477 or 0776 399 979; email seru@kemri.go.ke).

  - heading: More information
    body: https://doi.org/10.1136/bmjgh-2021-005300

# Shown above the "I agree" / "I do not agree" buttons. Agreeing is recorded
# with this file's version and sha256.
agreement: >-
  By selecting "I agree" you confirm that you have read this information and
  agree that: (1) your registration details and the ratings you submit will
  be recorded and stored as described above; (2) de-identified data from
  your ratings may be used for research, including analysis, policy
  documents and publications; and (3) de-identified individual and summary
  information may be shared among the collaborating institutions listed
  above in ways that do not reveal your identity.

